<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
</head>

<body>
  <div style="display:flex; justify-content:center;">
    <div style="margin-top:80px; display:flex; flex-direction:column; align-items:center; gap:30px; width:20%; background-color:darkslategray; height:600px;">
      
      <h1 style="color:darkcyan;">Calculator</h1>

      <button id="read" style="background-color:khaki;">Read</button>
      <button id="add" style="background-color:blanchedalmond;">Add</button>
      <button id="subtract" style="background-color:blueviolet;">Subtract</button>
      <button id="multiply" style="background-color:darkslateblue;">Multiply</button>

    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
