<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Temperature Converter</title>
</head>

<body>
  <div style="display:flex; justify-content:center;">
    <div style="margin-top:80px; display:flex; flex-direction:column; align-items:center; gap:30px; width:20%; background-color:darkslategray; height:600px;">
      
      <h1 style="color:darkcyan;">Temperature Converter</h1>

      <button id="read" style="background-color:khaki;">Read (Celsius)</button>
      <button id="fahrenheit" style="background-color:blanchedalmond;">To Fahrenheit</button>
      <button id="kelvin" style="background-color:blueviolet;">To Kelvin</button>
      <button id="display" style="background-color:darkslateblue;">Display</button>

    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
